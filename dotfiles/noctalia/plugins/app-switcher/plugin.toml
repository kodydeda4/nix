# Cmd+Tab app switcher: one tile per app (no duplicates), most recently used
# first, in a 4-column grid in the middle of the screen. Opened by Cmd+Tab
# (dotfiles/hypr/hyprland.lua); see panel.luau for the keys.

id = "kody/app-switcher"
name = "App Switcher"
version = "1.0.0"
plugin_api = 26
author = "kody"
license = "MIT"
dependencies = []
tags = ["hyprland", "productivity"]
icon = "app-window"
description = "A Mac-style app switcher with vim keys."

[[panel]]
id = "switcher"
entry = "panel.luau"
# 4 x 2 tiles at a time (the grid moves a row as the selection leaves it); the
# rest of the screen stays clear above and below
width = 690
height = 370
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
# Escape always closes the panel (the host handles it)
capture_keys = [
  "h", "j", "k", "l",
  "left", "down", "up", "right",
  "tab", "shift+tab",
  # Cmd still held: keyd sends Cmd+key as Alt+key (Cmd+Tab arrives through
  # Hyprland's Alt+Tab bind instead)
  "alt+h", "alt+j", "alt+k", "alt+l", "alt+shift+tab",
  "return", "kp_enter", "space",
  # letting go of Cmd (keyd holds Alt while Cmd is down): switch
  "alt_l",
]
