# Noctalia (Hyprland's bar/launcher). Settings changed in the GUI go to
# settings.toml next to this file; this one is for things set by hand.
# Docs: https://docs.noctalia.dev/v5/

[shell]
# 12-hour clock (lock screen, control center, calendar)
time_format = "{:%-I:%M %p}"

[shell.animation]
enabled = false # no animations (Hyprland's are off too)

# No sound effects: notifications, volume changes and the rest are silent
[audio]
enable_sounds = false

[shell.screenshot]
directory = "~/Pictures/Screenshots" # default is ~/Pictures

[shell.panel]
transparency_mode = "glass" # translucent launcher, control center, panels
# Panels opened from the bar (control center, clipboard, power menu, wallpaper)
# drop down under the item clicked, like the Mac's menus, not mid-screen.
# Floating, not attached to the bar: an attached panel takes the bar's
# background, which is fully transparent (below), so it had none.
control_center_placement = "floating"
session_placement = "floating"
wallpaper_placement = "floating"
open_near_click_control_center = true
open_near_click_clipboard = true
open_near_click_session = true
open_near_click_wallpaper = true

# Cmd+Tab switcher (bound in dotfiles/hypr), like the Mac's: a strip of app
# icons, most recently used first, so a quick Cmd+Tab goes to the last app
[shell.window_switcher]
style = "compact"
mru = true
current_workspace_only = false
show_caption = false # just the icons: no window titles
show_count = false

# Switching light / dark from Noctalia switches the apps too (GNOME's
# color-scheme); the other way round is dotfiles/hypr/follow-appearance.sh
# running in the background.
[hooks]
theme_mode_changed = "bash ~/.config/hypr/follow-appearance.sh from-noctalia"
# a newly picked wallpaper gets the menu bar's fading blur (the bar itself is
# transparent, below): dotfiles/hypr/menubar-wallpaper.sh
wallpaper_changed = "bash ~/.config/hypr/menubar-wallpaper.sh"

[bar.default]
# Full-width bar flush with the screen edges, like the Mac's menu bar
margin_ends = 0
radius = 0
concave_edge_corners = false
# Fully transparent, like macOS 26's menu bar: no background, blur or shadow,
# so there's no edge between it and the wallpaper. (A blur can't fade out:
# Noctalia draws the bar in one flat color and Hyprland's blur stops sharp at
# its edge.)
background_opacity = 0.0
compositor_blur = false
shadow = false
border_width = 0.0
# Same white text and icons in light and dark mode: the bar sits on the
# wallpaper, not on a themed surface. (A widget's own `color` still wins, e.g.
# the game mode button while on.)
color = "#ffffff"
icon_color = "#ffffff"
widget_spacing = 14 # room between the items, like the Mac's (default 6)
# Left side: just the workspace dots. (Launcher: Cmd+Space. Wallhaven: right
# click the clock, or Meh+W.)
start = ["workspaces"]
# Nothing in the middle: the clock sits at the far right, like the Mac's
center = []
# Right side, read right to left: time, date, battery, wifi, volume,
# bluetooth, clipboard, notifications, game mode, tile size, then power,
# brightness and app tray icons. (No "now playing" or control-center button;
# the control center opens by clicking the clock.)
end = ["tray", "brightness", "session", "tile_scale", "gamemode", "notifications", "clipboard", "bluetooth", "volume", "network", "battery", "date", "clock"]

# The 4K ASUS monitor: everything in the bar 30% bigger (its items looked tiny
# there). Matched by model, so it works on any port; the laptop screen keeps
# the sizes above.
[bar.default.monitor.asus_4k]
match = "XG32UCWG"
scale = 1.3
thickness = 44

# Game mode button: plain Ctrl, Alt and Super while on (keyd's modifier
# remaps off); see dotfiles/hypr/gamemode.sh. It lights up while on: gamemode.sh
# writes that look to zz-gamemode-state.toml next to this file.
[widget.gamemode]
type = "custom_button"
glyph = "device-gamepad-2"
tooltip = "Game mode: off"

[widget.gamemode.actions]
left = "exec bash ~/.config/hypr/gamemode.sh toggle"

# Tile size button: switches Hyprland's snap keys (Meh+H/L/Space...) between
# the whole screen and a centered area 75% wide, 90% tall, for a big monitor. See
# toggle_tile_scale() in dotfiles/hypr/hyprland.lua; it lights up while narrow
# (hyprland.lua writes that look to zz-tile-scale-state.toml next to this file).
[widget.tile_scale]
type = "custom_button"
glyph = "viewport-wide"
tooltip = "Tile size: 100%"

[widget.tile_scale.actions]
left = "exec hyprctl eval 'toggle_tile_scale()'"

[widget.workspaces]
# Small dots for workspaces 1-5 (kept alive in dotfiles/hypr), like the page
# dots on macOS / iOS: the current one in the bar's white, the rest dimmer
# (fixed, not theme colors, so they don't change with light / dark either)
show_labels = false
show_icons = false
pill_scale = 0.7 # thinner than Noctalia's pills (1.0)
active_pill_size = 1.0 # round, not stretched into a pill
inactive_pill_size = 1.0
focused_color = "#ffffff"
occupied_color = "#ffffffb3" # 70% white
empty_color = "#ffffff66" # 40% white

[widget.clock]
# 12-hour time at the far right of the bar, like the Mac's: "9:41 PM"
format = "{:%-I:%M %p}"

[widget.clock.actions]
left = "panel-toggle control-center home" # what right click did (default left: calendar)
right = "panel-toggle noctalia/wallhaven:browser" # Wallhaven browser

# Battery, wifi and volume as just their icons, like the Mac's (no percentage
# or network name next to them)
[widget.battery]
show_label = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

# The date, just left of the time: "Sun Oct 25". A second clock widget;
# either click opens the calendar (with my Google events, [calendar] below).
[widget.date]
type = "clock"
format = "{:%a %b %-d}"

[widget.date.actions]
left = "panel-toggle control-center calendar"
right = "panel-toggle control-center calendar"

# Events from my Google calendar (the same one GNOME Calendar shows) in the
# control center's calendar, plus reminders before they start. Signed in
# once from Settings -> Calendar -> Accounts -> Google -> Save and Connect;
# the token is kept in GNOME Keyring, not here.
[calendar]
enabled = true
event_time_format = "%-I:%M %p" # 12-hour, like the clock

[calendar.account.google]
type = "google"
name = "Google"

[dock]
enabled = true
show_dots = true # dot under every open app, like the Mac
show_instance_count = false # just the dot, no window count
reserve_space = false # Hyprland keeps its space free instead (dotfiles/hypr, launcher's Toggle Dock)
# Frosted glass like the Mac's dock: translucent over a blur (Hyprland's,
# dotfiles/hypr), rounded all round, floating just above the screen edge, a
# thin outline and no heavy shadow (it looked muddy in light mode)
background_opacity = 0.25 # lower is less bright in light mode (one value for both modes)
radius = 20
concave_edge_corners = false
margin_edge = 6
border = "outline"
border_width = 1.0
shadow = false
cross_axis_padding = 4 # less room above and below the icons (default 8)
inactive_scale = 1.0 # unfocused icons full size too: shrunk, they left a gap above
# Same apps as the GNOME dock (desktop file names without .desktop)
pinned = [
  "org.gnome.Nautilus",
  "brave-browser",
  "dev.zed.Zed",
  "com.anthropic.Claude",
  "github-desktop",
  "org.gnome.Calendar",
  "org.gnome.Geary",
  "com.mitchellh.ghostty",
  "md.obsidian.Obsidian",
  "steam",
  "slack",
]

[wallpaper]
# Wallpaper picker folder; the Wallhaven plugin downloads here too (default ~/Pictures)
directory = "~/Pictures/wallpapers"

[plugins]
# Wallhaven: browse wallhaven.cc and set a wallpaper (Meh+W in Hyprland).
# App Switcher: Cmd+Tab (plugins/app-switcher next to this file).
enabled = ["noctalia/wallhaven", "kody/app-switcher"]

# The Wallhaven browser floats with its own background and drops down near
# where it was opened from, like the control center (see [shell.panel])
[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "auto"
browser_open_near_click = true

# Noctalia's two default sources, plus my own plugins in plugins/ here
[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

[[plugins.source]]
name = "kody"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true

# Lock screen: the display turns off after 3 seconds without input there, and
# back on with any key or mouse move. (Unlocked: after 11 minutes, Noctalia's
# default for this behavior.)
[idle.behavior.screen-off]
enabled = true
action = "screen_off" # needed: this table replaces Noctalia's default one, it isn't merged into it
timeout = 660
locked_timeout = 3
