# Starship prompt. Linked to ~/.config/starship.toml by home.nix.

# Two-line prompt: info on the first line, prompt symbol on the second.
# No blank line between prompts.
add_newline = false

# OS icon first, then every other module in Starship's default order.
format = "$os$all"

# Icon for the current OS (NixOS here, Apple logo on macOS). Disabled by default.
[os]
disabled = false
style = "bold blue"

# Nerd Font logos instead of the default emoji.
[os.symbols]
NixOS = " "
Macos = " "

# GitHub account for the current repo, from `github.user` in
# dotfiles/git/<account>.config. Only shown inside a git repo.
[custom.github_user]
command = "git config github.user"
when = "git config github.user"
require_repo = true
symbol = " "
style = "bold purple"
format = "as [$symbol$output]($style) "

# Vi mode indicator (zsh `bindkey -v`): ❯ insert mode, ❮ normal mode.
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"
