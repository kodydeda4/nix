# Noctalia (Hyprland's bar/launcher). Settings changed in the GUI go to
# settings.toml next to this file; this one is for things set by hand.
# Docs: https://docs.noctalia.dev/v5/

[shell]
# 12-hour clock (lock screen, control center, calendar)
time_format = "{:%-I:%M %p}"

[shell.animation]
enabled = false # no animations (Hyprland's are off too)

[shell.screenshot]
directory = "~/Pictures/Screenshots" # default is ~/Pictures

[shell.panel]
transparency_mode = "glass" # translucent launcher, control center, panels

# Cmd+Tab switcher (bound in dotfiles/hypr), like the Mac's: a strip of app
# icons, most recently used first, so a quick Cmd+Tab goes to the last app
[shell.window_switcher]
style = "compact"
mru = true
current_workspace_only = false
show_caption = false # just the icons: no window titles
show_count = false

# Switching light / dark from Noctalia switches the apps too (GNOME's
# color-scheme); the other way round is dotfiles/hypr/follow-appearance.sh
# running in the background.
[hooks]
theme_mode_changed = "bash ~/.config/hypr/follow-appearance.sh from-noctalia"
# a newly picked wallpaper gets the menu bar's fading blur (the bar itself is
# transparent, below): dotfiles/hypr/menubar-wallpaper.sh
wallpaper_changed = "bash ~/.config/hypr/menubar-wallpaper.sh"

[bar.default]
# Full-width bar flush with the screen edges, like the Mac's menu bar
margin_ends = 0
radius = 0
concave_edge_corners = false
# Fully transparent, like macOS 26's menu bar: no background, blur or shadow,
# so there's no edge between it and the wallpaper. (A blur can't fade out:
# Noctalia draws the bar in one flat color and Hyprland's blur stops sharp at
# its edge.)
background_opacity = 0.0
compositor_blur = false
shadow = false
border_width = 0.0
widget_spacing = 14 # room between the items, like the Mac's (default 6)
# Left side: just the workspace dots. (Launcher: Cmd+Space. Wallhaven: right
# click the clock, or Meh+W.)
start = ["workspaces"]
# Right side, read right to left: power, battery, wifi, volume, brightness,
# bluetooth, clipboard, notifications, then app tray icons. (No "now playing"
# or control-center button; the control center opens by clicking the clock.)
end = ["tray", "gamemode", "notifications", "clipboard", "bluetooth", "brightness", "volume", "network", "battery", "session"]

# The 4K ASUS monitor: everything in the bar 30% bigger (its items looked tiny
# there). Matched by model, so it works on any port; the laptop screen keeps
# the sizes above.
[bar.default.monitor.asus_4k]
match = "XG32UCWG"
scale = 1.3
thickness = 44

# Game mode button: plain Ctrl, Alt and Super while on (keyd's modifier
# remaps off); see dotfiles/hypr/gamemode.sh. It lights up while on: gamemode.sh
# writes that look to zz-gamemode-state.toml next to this file.
[widget.gamemode]
type = "custom_button"
glyph = "device-gamepad-2"
tooltip = "Game mode: off"

[widget.gamemode.actions]
left = "exec bash ~/.config/hypr/gamemode.sh toggle"

[widget.workspaces]
# Plain dots for workspaces 1-5 (kept alive in dotfiles/hypr); the selected
# one is highlighted in the wallpaper color
show_labels = false
active_pill_size = 1.0
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "on_surface_variant"
empty_color = "outline" # lighter than surface_variant, still dimmer than occupied

[widget.clock]
# 12-hour clock in the bar
format = "{:%-I:%M %p}"

[widget.clock.actions]
left = "panel-toggle control-center home" # what right click did (default left: calendar)
right = "panel-toggle noctalia/wallhaven:browser" # Wallhaven browser

[dock]
enabled = true
show_dots = true # dot under every open app, like the Mac
show_instance_count = false # just the dot, no window count
reserve_space = false # Hyprland keeps its space free instead (dotfiles/hypr, Super+Alt)
# Frosted glass like the Mac's dock: translucent over a blur (Hyprland's,
# dotfiles/hypr), rounded all round, floating just above the screen edge, a
# thin outline and no heavy shadow (it looked muddy in light mode)
background_opacity = 0.25 # lower is less bright in light mode (one value for both modes)
radius = 20
concave_edge_corners = false
margin_edge = 6
border = "outline"
border_width = 1.0
shadow = false
cross_axis_padding = 4 # less room above and below the icons (default 8)
inactive_scale = 1.0 # unfocused icons full size too: shrunk, they left a gap above
# Same apps as the GNOME dock (desktop file names without .desktop)
pinned = [
  "org.gnome.Nautilus",
  "brave-browser",
  "dev.zed.Zed",
  "com.anthropic.Claude",
  "github-desktop",
  "org.gnome.Calendar",
  "org.gnome.Geary",
  "com.mitchellh.ghostty",
  "md.obsidian.Obsidian",
  "steam",
  "slack",
]

[theme.templates]
# Window borders in Hyprland take their colors from the wallpaper
builtin_ids = ["hyprland"]

[wallpaper]
# Wallpaper picker folder; the Wallhaven plugin downloads here too (default ~/Pictures)
directory = "~/Pictures/wallpapers"

[plugins]
# Wallhaven: browse wallhaven.cc and set a wallpaper (Meh+W in Hyprland).
# App Switcher: Cmd+Tab (plugins/app-switcher next to this file).
enabled = ["noctalia/wallhaven", "kody/app-switcher"]

# Noctalia's two default sources, plus my own plugins in plugins/ here
[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

[[plugins.source]]
name = "kody"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true

# Lock screen: the display turns off after 3 seconds without input there, and
# back on with any key or mouse move. (Unlocked: after 11 minutes, Noctalia's
# default for this behavior.)
[idle.behavior.screen-off]
enabled = true
timeout = 660
locked_timeout = 3
