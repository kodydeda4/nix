# tmux config. ~/.config/tmux -> dotfiles/tmux (home.nix). Reload: Ctrl-a r

unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",*:hyperlinks"  # pass clickable OSC 8 links through to ghostty

set -g prefix C-a

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

set-window-option -g mode-keys vi

# split
bind-key -n C-v split-window -v

# allow vim-tmux-navigator to pass C-l through for clearing (optional)
# vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
# Ctrl+E: side-by-side split -- in nvim it's passed through (nvim splits its
# own window), anywhere else tmux splits the pane. Defined after is_vim.
bind-key -n C-e if-shell "$is_vim" "send-keys C-e" "split-window -h"

# [sessions]
bind -n M-h switch-client -p
bind -n M-l switch-client -n

# [pane] resize
bind-key -n C-S-h resize-pane -L 5
bind-key -n C-S-j resize-pane -D 5
bind-key -n C-S-k resize-pane -U 5
bind-key -n C-S-l resize-pane -R 5
bind-key -n C-w kill-pane

# [tab]
bind-key -n M-t new-window
# bind-key -n M-l next-window
# bind-key -n M-h previous-window
bind-key -n M-w kill-window

# [tab] focus
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

#----------------------------------
# status bar: minimal dots, fixed positions
#   left   session name, then one dot per tab (current = filled blue)
#   right  current tab's name, then the time
# every dot is the same width, so nothing shifts when you switch tabs
# colors from Ghostty's atom-one-dark-oled (same as nvim onedark + chadrc)
#----------------------------------
set -g status-position bottom

set -g status on
set -gu status-format
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#5c6370"
# reset sub-styles too (old themes leave a solid bg behind until tmux restarts)
set -g status-left-style default
set -g status-right-style default
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default

set -g status-left-length 30
set -g status-left "#[fg=#3e4451] #S  "
set -g status-right-length 60
set -g status-right "#[fg=#e0def4,bold]#W#{?window_zoomed_flag,#[fg=#e5c07b] +,}#[fg=#3e4451,nobold]  %-I:%M %p "

# tabs: ○ other tabs, ● current tab (yellow while Ctrl-a is held)
set -g window-status-separator ""
set -g window-status-format "#[fg=#3e4451]○ "
set -g window-status-current-format "#[fg=#{?client_prefix,#e5c07b,#61afef}]● "
set -g window-status-activity-style "fg=#e5c07b"
set -g window-status-bell-style "fg=#e06c75"

# quiet pane borders, prompts and selection
set -g pane-border-lines single
set -g pane-border-style "fg=#2c313a"
set -g pane-active-border-style "fg=#3e4451"
set -g message-style "bg=default,fg=#61afef"
set -g message-command-style "bg=default,fg=#61afef"
set -g mode-style "bg=#2c313a,fg=#e0def4"
